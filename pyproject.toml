[tool.poetry]
name = "kairoz"
version = "0.3"
description = "State Estimation with simualted sensors and Kalman Filter"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12"
numpy = "^2.5.2"
matplotlib = "^3.11.1"
control = "^0.10.2"
torch = "^2.13.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.16.4"
pyright = "^1.1.411"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["scripts"]
exclude = [
    "**/__pycache__",
]
typeCheckingMode = "standard"
